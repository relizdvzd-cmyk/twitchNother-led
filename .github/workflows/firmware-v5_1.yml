name: Retired unsafe v5.1 app-only flashing publisher

# This old workflow previously published an app-only BIN as if it were a full
# installable image. Installing it after erasing Flash can destroy the bootloader.
# It is intentionally retired. Use compile-v5_2.yml for verification only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Explain retired workflow
        run: |
          echo "Web flashing is disabled until a safe full bootloader+partition+app image is tested."
          echo "No firmware is published by this workflow."
